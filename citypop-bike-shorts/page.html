<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Dela;src:url(fonts/DelaGothicOne-Regular.ttf)}
@font-face{font-family:Rock;src:url(fonts/RocknRollOne-Regular.ttf)}
@font-face{font-family:Kaisei;src:url(fonts/KaiseiDecol-Bold.ttf)}
@font-face{font-family:Reggae;src:url(fonts/ReggaeOne-Regular.ttf)}
@font-face{font-family:Yusei;src:url(fonts/YuseiMagic-Regular.ttf)}
@font-face{font-family:Monoton;src:url(fonts/Monoton-Regular.ttf)}
@font-face{font-family:VT;src:url(fonts/VT323-Regular.ttf)}
@font-face{font-family:Pacifico;src:url(fonts/Pacifico-Regular.ttf)}
@font-face{font-family:ZenA;src:url(fonts/ZenAntique-Regular.ttf)}
@font-face{font-family:Dot;src:url(fonts/DotGothic16-Regular.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
const which = new URLSearchParams(location.search).get('v') || 'a';
window.READY = (async () => {
  for (const f of ['Dela','Rock','Kaisei','Reggae','Yusei','Monoton','VT','Pacifico','ZenA','Dot']) await document.fonts.load(`40px ${f}`, '昭和あアA1');
  await new Promise(res => { const s = document.createElement('script'); s.src = which + '.js'; s.onload = res; document.body.appendChild(s); });
  await window.init();
  return true;
})();
</script></body></html>
