<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok 認可コード</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}code{display:block;word-break:break-all;background:#f4f4f4;padding:12px;border-radius:6px}button{font-size:16px;padding:8px 16px}</style></head>
<body><h1>TikTok の認可が完了しました</h1>
<p>下のコードをコピーして、PC で次のコマンドを実行してください。</p>
<pre>python tiktok_auth.py --code "コピーしたコード"</pre>
<p>code:</p><code id="code">(URL に code がありません)</code>
<p><button id="copy">コードをコピー</button> <span id="msg"></span></p>
<p>state: <span id="state"></span> / error: <span id="err"></span></p>
<script>
var q=new URLSearchParams(location.search);var c=q.get('code');
if(c){document.getElementById('code').textContent=c;}
document.getElementById('state').textContent=q.get('state')||'';
document.getElementById('err').textContent=(q.get('error')||'')+' '+(q.get('error_description')||'');
document.getElementById('copy').onclick=function(){if(!c)return;navigator.clipboard.writeText(c).then(function(){document.getElementById('msg').textContent='コピーしました';});};
</script></body></html>
